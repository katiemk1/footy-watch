<style>
body{margin:0;font-family:Arial}
#map{height:100vh}

/* Transparent ticker */
#ticker{
  position:absolute;
  top:8px;
  left:80px;
  right:20px;
  background:rgba(11,102,178,0.85);
  color:white;
  padding:12px 20px;
  font-weight:bold;
  z-index:900;
  white-space:nowrap;
  overflow:hidden;
  border-radius:8px;
  backdrop-filter:blur(4px);
}
#ticker span{
  display:inline-block;
  padding-left:100%;
  animation:scroll 90s linear infinite
}
@keyframes scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

/* Sidebars */
.sidebar{
  position:absolute;
  right:10px;
  width:270px;
  background:white;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
  overflow:hidden;
  z-index:1000;
  transition:top .25s ease;
}
.header{
  background:#0b66b2;
  color:white;
  padding:8px;
  font-weight:bold;
  cursor:pointer
}
.content{
  display:none;
  max-height:320px;
  overflow:auto;
  padding:8px
}

/* Club cards */
.club{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  cursor:pointer
}
.club img{
  width:28px;
  height:28px;
  border-radius:50%;
}

/* Event types */
.eventGameMetro{color:#66ccff}
.eventGameTournament{color:#003366}
.eventPractice{color:#32cd32}

/* Calendar */
#calendar{
  position:absolute;
  bottom:12px;
  right:12px;
  background:white;
  padding:10px;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  z-index:1000
}
#eventList{
  margin-top:8px;
  font-size:13px
}

/* Tooltip */
.leaflet-tooltip.club-tooltip{font-family:Arial;font-size:13px;text-align:center;transition:all 0.3s ease;}
</style>
</head>

<div class="sidebar" style="top:60px">
  <div class="header" onclick="toggle('clubsContent')">Women's Football Teams</div>
  <div class="content" id="clubsContent"></div>
</div>

  <div class="header" onclick="toggle('eventsContent')">Events</div>
  <div class="content" id="eventsContent">

      <div><span style="color:#66ccff">●</span> Club Metro</div>
      <div><span style="color:#003366">●</span> Club Tournament</div>
      <div><span style="color:#32cd32">●</span> Practice</div>
    </div>
  </div>
</div>

<div id="calendar">
  <input type="date" id="datePicker">
  <div id="eventList"></div>

];

/* ---------------- STATE ---------------- */
let selectedClub=null;
const clubMarkers={};
let leagueMarker=null;
const defaultView=[39,-96], defaultZoom=4;

/* ---------------- MAP ---------------- */
const map=L.map("map").setView(defaultView,defaultZoom);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:10,disableClusteringAtZoom:6});
map.addLayer(cluster);

/* ---------------- ICONS ---------------- */
function getLogoSize(){const z=map.getZoom();if(z>=7)return 70;if(z>=6)return 50;if(z>=5)return 40;return 32;}
function createClubIcon(logo){const size=getLogoSize();return L.divIcon({className:"",html:`<img src="${logo}" style="width:${size}px;height:${size}px;border-radius:50%">`});}
function createEventIcon(logo,color){const size=getLogoSize(), ring=Math.max(3,size*0.08); return L.divIcon({className:"",html:`<img src="${logo}" style="width:${size}px;height:${size}px;border-radius:50%;border:${ring}px solid ${color}">`});}
function createLeagueIcon(){return L.divIcon({className:"",html:`<div style="width:20px;height:20px;background:#66ccff;border-radius:50%;border:2px solid white"></div>`});}

/* ---------------- HELPERS ---------------- */
function getUpcomingEvents(clubName,n=3){
  const today=new Date();
  return events.filter(e=>e.club===clubName)
    .map(e=>({date:new Date(e.date),raw:e}))
    .filter(e=>e.date>=today)
    .sort((a,b)=>a.date-b.date)
    .slice(0,n)
    .map(x=>x.raw);
}

/* ---------------- MARKERS ---------------- */
clubs.forEach(club=>{
  const marker=L.marker([club.lat,club.lon],{icon:createClubIcon(club.logo)});
  marker.club=club;

  marker.on("click",()=>{
    selectedClub=club.name;
    map.flyTo([club.lat,club.lon],7);
    showClubEvents(club.name);
  });

  marker.on("mouseover",()=>{
    const next=getUpcomingEvents(club.name,1)[0];
    const instagram=club.instagram?`<br><a href="https://www.instagram.com/${club.instagram.replace("@","")}/" target="_blank">${club.instagram}</a>`:"";
    marker.bindTooltip(`<b>${club.name}</b>${instagram}`)
    if(!next) return;
    const typeLabel=next.type==="practice"?"Practice":next.category==="club-metro"?"Club Metro":"Club Tournament";
    marker.bindTooltip(`<b>${club.name}</b>${instagram}<br>Next Event: ${next.date}<br>${typeLabel}`,{direction:"top",offset:[0,-10],opacity:0.9,sticky:true,className:"club-tooltip"}).openTooltip();
  });
  marker.on("mouseout",()=>marker.closeTooltip());

  cluster.addLayer(marker);
  clubMarkers[club.name]=marker;
});


/* ---------------- ZOOM ICON RESIZE ---------------- */
map.on("zoomend",()=>{
  Object.values(clubMarkers).forEach(m=>{
    const next=getUpcomingEvents(m.club.name,1)[0];
    const color=next?.type==="practice"?"#32cd32":next?.category==="club-tournament"?"#003366":"#66ccff";
    m.setIcon((selectedClub===m.club.name && next) ? createEventIcon(m.club.logo,color) : createClubIcon(m.club.logo));
  });
});

/* ---------------- CALENDAR ---------------- */
document.getElementById("datePicker").addEventListener("change",e=>showEventsForDate(e.target.value));

function showEventsForDate(date){
  const list=document.getElementById("eventList");
  list.innerHTML="<b>Events for "+date+"</b><br>";
  if(leagueMarker){map.removeLayer(leagueMarker);leagueMarker=null;}
  events.forEach(e=>{
    if(e.date!==date) return;
    let cls=e.type==="practice"?"eventPractice":e.category==="club-metro"?"eventGameMetro":e.category==="club-tournament"?"eventGameTournament":"eventGameTournament";
    list.innerHTML+=`<div class="${cls}">${e.club} — ${e.type==="practice"?"Practice":e.category==="club-metro"?"Club Metro":e.category==="club-tournament"?"Club Tournament":"League Tournament"}</div>`;
    if(e.category==="league-tournament"){
      leagueMarker=L.marker([e.lat,e.lon],{icon:createLeagueIcon()}).addTo(map);
      map.flyTo([e.lat,e.lon],5);
    }
  });
}

/* ---------------- CLUB EVENTS ---------------- */
function showClubEvents(clubName){
  const list=document.getElementById("eventList");
  const eventsToShow=getUpcomingEvents(clubName,3);
  list.innerHTML="<b>"+clubName+" upcoming events</b><br>";
  eventsToShow.forEach(e=>{
    const cls=e.type==="practice"?"eventPractice":e.category==="club-metro"?"eventGameMetro":e.category==="club-tournament"?"eventGameTournament":"eventGameTournament";
    list.innerHTML+=`<div class="${cls}">${e.date} — ${e.type==="practice"?"Practice":e.category==="club-metro"?"Club Metro":e.category==="club-tournament"?"Club Tournament":"League Tournament"}</div>`;
  });
}

/* ---------------- TICKER ---------------- */
function buildTicker(){
  const upcoming=events.filter(e=>e.type==="game").sort((a,b)=>new Date(a.date)-new Date(b.date));
  const text=upcoming.map(e=>`${e.date} — ${e.club} ${e.category==="club-metro"?"Club Metro":e.category==="club-tournament"?"Club Tournament":"League Tournament"}`).join(" | ");
  document.getElementById("tickerText").textContent=text;
}
buildTicker();

/* ---------------- SIDEBAR ---------------- */
const clubList=document.getElementById("clubsContent");
clubs.forEach(club=>{
  const div=document.createElement("div");
  div.className="club";
  div.innerHTML=`<img src="${club.logo}">${club.name}`;
  div.onclick=()=>{selectedClub=club.name; map.flyTo([club.lat,club.lon],7); showClubEvents(club.name);}
  clubList.appendChild(div);
});

/* ---------------- SIDEBAR TOGGLE ---------------- */
function toggle(id){
  const clubsContent=document.getElementById("clubsContent");
  const eventsContent=document.getElementById("eventsContent");
  const eventsSidebar=document.querySelectorAll(".sidebar")[1];
  if(id==="clubsContent"){
    const isOpen=clubsContent.style.display==="block";
    clubsContent.style.display=isOpen?"none":"block";
    eventsSidebar.style.top=isOpen?"100px":(70+clubsContent.scrollHeight/3+10)+"px";
    map.setView(defaultView,defaultZoom);
  }
  if(id==="eventsContent"){
    const isOpen=eventsContent.style.display==="block";
    eventsContent.style.display=isOpen?"none":"block";
    if(!isOpen){ clubsContent.style.display="none"; eventsSidebar.style.top="100px"; }
  }
}
</script>

</html>
