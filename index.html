<html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', Arial, sans-serif;
  font-size: 16px;
}

#map { height: 100vh; }

/* ── Ticker ── */
#ticker {
  position: fixed;
  top: 12px;
  left: 56px;
  right: 12px;
  height: 60px;
  background: rgba(135, 206, 250,0.6);
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  overflow: hidden;
  z-index: 900;
}

#ticker-badge {
  background: rgba(135, 206, 250,1);
  color: rgba(40,50,70,1);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 5px;
  margin: 0 12px;
  white-space: nowrap;
  flex-shrink: 0;
  z-index: 2;
}

#tickerText {
  font-family: 'DM Mono', monospace;
  font-size: 16px;
  color: rgba(40,50,70,1);
  white-space: nowrap;
  display: inline-block;
  padding-left: 100%;
  animation: scroll 300s linear infinite;
  position: relative;
  z-index: 1;
}

/* slower ticker on phones */
@media (max-width:700px) {
  #tickerText {
    font-size: 14px;
    animation: scroll 240s linear infinite;
  }
}

/* @keyframes scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
} */

@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

:root{
  --ticker-height:60px;
}
    
/* ── Sidebars ── */
.sidebar {
  position: absolute;
  right: 12px;
  width: 248px;
  background: rgba(135, 206, 250,0.3);
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow: hidden;
  z-index: 1000;
  transition: top 0.25s ease;
}

.sidebar-icon {
  width: 20px;
  height: 20px;
  margin-right: 8px;
  flex-shrink: 0;
  transform: rotate(-20deg);
}

.sidebar:nth-of-type(1){
  top: calc(var(--ticker-height) + 30px);
}

.sidebar:nth-of-type(2){
  top: calc(var(--ticker-height) + 80px);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.03);
  border-bottom: 0.5px solid rgba(0,0,0,0.07);
  color: rgba(30,40,60,0.55);
  padding: 10px 14px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
}

.header::after {
  content: '›';
  font-size: 16px;
  font-weight: 400;
  opacity: 0.4;
  transition: transform 0.2s;
}

.header.open::after {
  transform: rotate(90deg);
}

.content {
  display: none;
  max-height: 280px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
  padding: 6px 0;
}

/* ── Club cards ── */
.club {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.15s;
}

.club:hover { background: rgba(0,0,0,0.04); }

.club.active { background: rgba(37,99,235,0.08); }

.club img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0.5px solid rgba(0,0,0,0.1);
  object-fit: cover;
  background: rgba(0,0,0,0.04);
  flex-shrink: 0;
}

.club-name {
  font-size: 12px;
  color: rgba(30,40,60,0.8);
  font-weight: 400;
  line-height: 1.3;
}

.club.active .club-name {
  color: #60a5fa;
  font-weight: 600;
}

/* ── Event legend in sidebar ── */
.legend-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 14px;
  font-size: 12px;
  color: rgba(30,40,60,0.65);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-divider {
  margin: 4px 14px;
  border: none;
  border-top: 0.5px solid rgba(0,0,0,0.07);
}

/* ── Event type colors ── */
.eventGameMetro    { color: #2563eb; }
.eventGameTournament { color: #6366f1; }
.eventLeague       { color: #d97706; }
.eventPractice     { color: #16a34a; }

/* ── Calendar panel ── */
#calendar {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 248px;
  background: rgba(255,255,255,0.88);
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 1000;
  padding: 12px 14px;
}

.cal-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(30,40,60,0.35);
  margin-bottom: 8px;
}

.calendar-icon{
  font-size:20px;
  line-height:1;
}

#datePicker {
  width: 100%;
  background: rgba(0,0,0,0.04);
  border: 0.5px solid rgba(0,0,0,0.12);
  border-radius: 6px;
  color: rgba(30,40,60,0.85);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 7px 10px;
  margin-bottom: 10px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s;
  color-scheme: light;
}

#datePicker:focus { border-color: rgba(37,99,235,0.4); }

#eventList {
  font-size: 12px;
  color: rgba(30,40,60,0.65);
}

#eventList b {
  display: block;
  color: rgba(30,40,60,0.4);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.event-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
  font-size: 11px;
  color: rgba(30,40,60,0.7);
}

.event-row:last-child { border-bottom: none; }

.event-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Leaflet overrides ── */
.leaflet-control-zoom a {
  background: rgba(255,255,255,0.9) !important;
  border-color: rgba(0,0,0,0.12) !important;
  color: rgba(30,40,60,0.7) !important;
  backdrop-filter: blur(12px);
}

.leaflet-control-zoom a:hover {
  background: rgba(37,99,235,0.1) !important;
  color: #2563eb !important;
}

.leaflet-control-attribution {
  background: rgba(255,255,255,0.75) !important;
  color: rgba(30,40,60,0.4) !important;
  font-size: 10px !important;
}

.leaflet-control-attribution a { color: rgba(37,99,235,0.7) !important; }

/* ── Tooltip ── */
.leaflet-tooltip.club-tooltip {
  font-family: 'Sora', sans-serif;
  font-size: 12px;
  background: rgba(255,255,255,0.95);
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  color: rgba(30,40,60,0.85);
  padding: 8px 12px;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}

.leaflet-tooltip.club-tooltip::before {
  border-top-color: rgba(0,0,0,0.1);
}

/* ── Cluster marker tweaks ── */
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background-clip: padding-box;
}

.marker-cluster-small { background-color: rgba(37,99,235,0.15); }
.marker-cluster-small div { background-color: rgba(37,99,235,0.5); color: white; font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; }

.marker-cluster-medium { background-color: rgba(37,99,235,0.2); }
.marker-cluster-medium div { background-color: rgba(37,99,235,0.55); color: white; font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; }

.marker-cluster-large { background-color: rgba(37,99,235,0.25); }
.marker-cluster-large div { background-color: rgba(37,99,235,0.65); color: white; font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; }

@media (max-width: 700px) {

  body {
    font-size: 17px;
  }

  #tickerText {
    font-size: 14px;
  }

  .header {
    font-size: 13px;
  }

  .club-name {
    font-size: 16px;
  }

  .legend-row {
    font-size: 15px;
  }

  .event-row {
    font-size: 15px;
  }

  #eventList {
    font-size: 15px;
  }

  /* collapse sidebars to circular buttons */
  .sidebar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    padding: 0;
    transition:all .25s ease;
  }
   
  .sidebar.expanded {
    width: calc(100% - 20px);
    height: auto;
    border-radius: 12px;
  }

  /* .sidebar:nth-of-type(1) {
    top: 60px;
    right: 10px;
  }

  .sidebar:nth-of-type(2) {
    top: 120px;
    right: 10px;
  } */

  .sidebar:nth-of-type(1) {
    top: calc(var(--ticker-height) + 10px);
  }

  .sidebar:nth-of-type(2) {
    top: calc(var(--ticker-height) + 70px);
  }

  .sidebar-icon {
    width: 18px;
    height: 18px;
  }

  .header {
    justify-content: center;
    font-size: 0;
    padding: 0;
    height: 52px;
  }

  .header::after {
    display: none;
  }

  .sidebar.expanded .header {
    font-size: 13px;
    justify-content: space-between;
    padding: 10px 14px;
  }

  .content {
    display: none;
  }

  .sidebar.expanded .content {
    display: block;
  }

}

/* map emphasis when filtering by date */
.marker-active img{
  transform:scale(1.15);
  transition:all .2s ease;
}

.marker-faded img{
  opacity:0.35;
  transform:scale(0.75);
  transition:all .2s ease;
}

</style>
</head>

/* ── STATE ── */
let selectedClub = null;
const clubMarkers = {};
let leagueMarker = null;
const defaultView = [39, -96], defaultZoom = 4;

/* ── MAP ── */
const map = L.map("map").setView(defaultView, defaultZoom);

L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({ maxClusterRadius: 5, disableClusteringAtZoom: 6 });
map.addLayer(cluster);

/* ── ICON HELPERS ── */
function getLogoSize() {
  const z = map.getZoom();

  if (window.innerWidth < 700) {
    if (z >= 7) return 80;
    if (z >= 6) return 60;
    if (z >= 5) return 48;
    return 40;
  }

  if (z >= 7) return 70;
  if (z >= 6) return 50;
  if (z >= 5) return 40;
  return 32;
}

function ringColor(event) {
  if (!event) return null;
  if (event.type === "practice")           return "#4ade80";
  if (event.category === "club-metro")     return "#60a5fa";
  if (event.category === "club-tournament")return "#818cf8";
  if (event.category === "league-tournament") return "#f59e0b";
  return "#60a5fa";
}

function dotColor(category) {
  if (category === "practice")          return "#4ade80";
  if (category === "club-metro")        return "#60a5fa";
  if (category === "club-tournament")   return "#818cf8";
  if (category === "league-tournament") return "#f59e0b";
  return "#60a5fa";
}

function createClubIcon(logo) {
  const size = getLogoSize();
  return L.divIcon({
    className: "",
    html: `<img src="${logo}" style="width:${size}px;height:${size}px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);box-shadow:0 2px 8px rgba(0,0,0,0.5);">`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function createEventIcon(logo, color) {
  const size = getLogoSize();
  const ring = Math.max(3, size * 0.09);
  return L.divIcon({
    className: "",
    html: `<img src="${logo}" style="width:${size}px;height:${size}px;border-radius:50%;border:${ring}px solid ${color};box-shadow:0 2px 12px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.08);">`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function createLeagueIcon() {
  return L.divIcon({
    className: "",
    html: `<div style="width:22px;height:22px;background:#f59e0b;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.5);"></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
}

/* ── HELPERS ── */
function getUpcomingEvents(clubName, n = 3) {
  const today = new Date();
  return events
    .filter(e => e.club === clubName)
    .map(e => ({ date: new Date(e.date), raw: e }))
    .filter(e => e.date >= today)
    .sort((a, b) => a.date - b.date)
    .slice(0, n)
    .map(x => x.raw);
}

function formatEventType(e) {
  if (e.type === "practice")                    return "Practice";
  if (e.category === "club-metro")              return "Club Metro";
  if (e.category === "club-tournament")         return "Club Tournament";
  if (e.category === "league-tournament")       return "League Tournament";
  return e.type;
}

/* ── MARKERS ── */
function buildClubCard(club, clickable=false){

  const nextGame = getNextGame(club.name);

  const ig = club.instagram
    ? clickable
      ? `<a href="https://www.instagram.com/${club.instagram.replace("@","")}/" target="_blank">${club.instagram}</a><br>`
      : `${club.instagram}<br>`
    : "";

  const contact = club.email
    ? clickable
      ? `<a href="mailto:${club.email}">${club.email}</a><br>`
      : `${club.email}<br>`
    : "";

  const website = club.website
    ? clickable
      ? `<a href="${club.website}" target="_blank">${club.website}</a><br>`
      : `${club.website}<br>`
    : "";

  const info = club.info
    ? `${club.info}<br>`
    : "";

  const gameBlock = nextGame
    ? `<div style="margin-top:6px;font-size:12px;color:#555;">
        <b>Next Game</b><br>
        ${nextGame.date}${nextGame.time ? " · " + nextGame.time : ""}
        ${nextGame.location ? "<br>" + nextGame.location : ""}
      </div>`
    : "";

  return `
    <div style="text-align:center;">
      <b>${club.name}</b><br>
      ${ig}
      ${contact}
      ${website}
      ${info}
      ${gameBlock}
    </div>
  `;
};

clubs.forEach(club => {

  const marker = L.marker([club.lat, club.lon], { icon: createClubIcon(club.logo) });
  marker.club = club;

  marker.on("click", () => {

    selectedClub = club.name;

    if (club.name === "Minnesota Freeze" || club.name === "North Star Blue Ox") {
      map.panTo([club.lat, club.lon], 8);   // move map but keep zoom
    } else {
      map.flyTo([club.lat, club.lon], 7);
    }

    showClubEvents(club.name);

    document.getElementById("eventsContent").style.display = "block";
    document.getElementById("eventsHeader").classList.add("open");

    highlightCalendarForClub(club.name);

    marker.bindPopup(buildClubCard(club, true)).openPopup();

  });

  marker.on("mouseover", () => {

    marker.bindTooltip(
      buildClubCard(club, false),
      { direction:"top", offset:[0,-10], opacity:1, sticky:true, className:"club-tooltip" }
    ).openTooltip();

  });

  marker.on("mouseout", () => {
    marker.closeTooltip();
  });

  cluster.addLayer(marker);
  clubMarkers[club.name] = marker;

});

/* ── ZOOM ICON RESIZE ── */
map.on("zoomend", () => {
  Object.values(clubMarkers).forEach(m => {
    const next = getUpcomingEvents(m.club.name, 1)[0];
    const color = ringColor(next);
    m.setIcon(
      (selectedClub === m.club.name && next)
        ? createEventIcon(m.club.logo, color)
        : createClubIcon(m.club.logo)
    );
  });
});

/* ── CALENDAR ── */
document.getElementById("datePicker").addEventListener("change", e => showEventsForDate(e.target.value));

function showEventsForDate(date) {
  const list = document.getElementById("eventList");

  if (leagueMarker) {
    map.removeLayer(leagueMarker);
    leagueMarker = null;
  }
  Object.values(clubMarkers).forEach(marker => {

  const el = marker.getElement();
  if(el){
    el.classList.remove("marker-active","marker-faded");
  }

  marker.setIcon(createClubIcon(marker.club.logo));

});

const dayEvents = events.filter(e => e.date === date);

if (!dayEvents.length) {
list.innerHTML = `<b>No events on ${date}</b>`;
return;
}

list.innerHTML = `<b>${date}</b>`;

dayEvents.forEach(e => {

  const color = dotColor(e.category);
  const label = formatEventType(e);

  const time = e.time ? ` · ${e.time}` : "";
  const loc  = e.location ? ` — ${e.location}` : "";

  list.innerHTML += `
    <div class="event-row">
      <div class="event-dot" style="background:${color};"></div>
      ${e.club} ${label}${time}${loc}
    </div>
  `;

  /* highlight club marker */
  if (clubMarkers[e.club]) {
    const club = clubMarkers[e.club].club;

    clubMarkers[e.club].setIcon(
      createEventIcon(club.logo, ringColor(e))
    );
  }

  /* league event marker */
  if (e.category === "league-tournament" && e.lat) {
    leagueMarker = L.marker(
      [e.lat, e.lon],
      { icon: createLeagueIcon() }
    ).addTo(map);

    map.flyTo([e.lat, e.lon], 5);
  }

});

/* emphasize markers AFTER loop */
Object.values(clubMarkers).forEach(m => {

  const el = m.getElement();
  if (!el) return;

  if (dayEvents.some(ev => ev.club === m.club.name)) {
    el.classList.add("marker-active");
    el.classList.remove("marker-faded");
  } else {
    el.classList.add("marker-faded");
    el.classList.remove("marker-active");
  }

});
}

function highlightCalendarForClub(clubName){

  const picker = document.getElementById("datePicker");

  const clubEvents = events.filter(e => e.club === clubName);

  if(!clubEvents.length) return;

  /* highlight next event date */
  const next = clubEvents
    .map(e => new Date(e.date))
    .filter(d => d >= new Date())
    .sort((a,b)=>a-b)[0];

  if(next){
    picker.value = next.toISOString().split("T")[0];
    showEventsForDate(picker.value);
  }

}
/* ── CLUB EVENTS ── */
function showClubEvents(clubName) {
  const list = document.getElementById("eventList");
  const upcoming = getUpcomingEvents(clubName, 3);

  list.innerHTML = `<b>${clubName}</b>`;

  if (!upcoming.length) {
    list.innerHTML += `<div class="event-row" style="color:rgba(255,255,255,0.35);">No upcoming events</div>`;
    return;
  }

  upcoming.forEach(e => {
    const color = dotColor(e.category);
    const label = formatEventType(e);
    list.innerHTML += `<div class="event-row"><div class="event-dot" style="background:${color};"></div>${e.date} — ${label}</div>`;
  });
}

function getNextGame(clubName){

  const today = new Date();

  const next = events
    .filter(e =>
      e.club === clubName &&
      (e.category === "club-metro" || e.category === "club-tournament") &&
      new Date(e.date) >= today
    )
    .sort((a,b)=> new Date(a.date) - new Date(b.date))[0];

  return next || null;

}

function buildEventSubtitle(e){

  if (e.location && e.time) {
    return `${e.location} • ${e.time}`;
  }

  if (e.location) return e.location;

  if (e.time) return e.time;

  return "";

}

/* ── TICKER ── */
function buildTicker() {
  const today = new Date();
  const upcoming = events
    .filter(e => e.type === "game" && new Date(e.date) >= today)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const text = upcoming
    .map(e => `${new Date(e.date + "T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})} · ${e.club} ${formatEventType(e)}`)
    .join("   |   ");
  document.getElementById("tickerText").textContent = text + "   ·   " + text;
}
buildTicker();

/* ── SIDEBAR CLUBS LIST ── */
const clubList = document.getElementById("clubsContent");
clubs.forEach(club => {
  const div = document.createElement("div");
  div.className = "club";
  div.dataset.club = club.name;
  div.innerHTML = `<img src="${club.logo}" alt="${club.name}"><span class="club-name">${club.name}</span>`;
  div.onclick = () => {
    selectedClub = club.name;
    if (club.name === "Minnesota Freeze" || club.name === "North Star Blue Ox") {
      map.panTo([club.lat, club.lon], 9);   // move map but keep zoom
    } else {
      map.flyTo([club.lat, club.lon], 7);
    }
    showClubEvents(club.name);
    document.querySelectorAll('.club').forEach(el => {
      el.classList.toggle('active', el.dataset.club === club.name);
    });
  };
  clubList.appendChild(div);
});

/* ── SIDEBAR TOGGLE ── */
function toggle(id) {

  const clubsContent  = document.getElementById("clubsContent");
  const eventsContent = document.getElementById("eventsContent");
  const clubsHeader   = document.getElementById("clubsHeader");
  const eventsHeader  = document.getElementById("eventsHeader");

  const clubsSidebar  = document.querySelectorAll(".sidebar")[0];
  const eventsSidebar = document.querySelectorAll(".sidebar")[1];

  const isMobile = window.innerWidth < 700;

  if (id === "clubsContent") {

    const isOpen = clubsContent.style.display === "block";

    clubsContent.style.display = isOpen ? "none" : "block";
    clubsHeader.classList.toggle("open", !isOpen);

    if (isMobile) {
      clubsSidebar.classList.toggle("expanded", !isOpen);
      eventsSidebar.classList.remove("expanded");
    }

    if (isOpen) {
      map.setView(defaultView, defaultZoom);
      eventsSidebar.style.top = "108px";
    } else {
      const h = Math.min(clubsContent.scrollHeight, 280);
      eventsSidebar.style.top = (62 + 40 + h + 8) + "px";
    }

  }

  if (id === "eventsContent") {

    const isOpen = eventsContent.style.display === "block";

    eventsContent.style.display = isOpen ? "none" : "block";
    eventsHeader.classList.toggle("open", !isOpen);

    if (isMobile) {
      eventsSidebar.classList.toggle("expanded", !isOpen);
      clubsSidebar.classList.remove("expanded");
    }
    if (!isOpen) {
      clubsContent.style.display = "none";
      clubsHeader.classList.remove("open");
      eventsSidebar.style.top = "108px";
    }
  }
}
</script>
